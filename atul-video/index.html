<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"speaker","type":"string","label":"Speaker name","default":"ATUL SIR"},{"id":"org","type":"string","label":"Organisation","default":"BHASKAR FOUNDATION"},{"id":"gold","type":"color","label":"Gold accent","default":"#F5C451"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000;
        --gold: #f5c451;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #cam {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        transform-origin: 50% 24%;
      }
      #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #vignette {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background:
          radial-gradient(ellipse 80% 62% at 50% 38%, rgba(0,0,0,0) 55%, rgba(8,5,0,0.5) 100%),
          linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.38) 100%);
      }
      #flash { position: absolute; inset: 0; z-index: 8; background: #fff6dc; opacity: 0; pointer-events: none; }
      #bug {
        position: absolute; right: 34px; top: 64px; width: 170px; height: 155px; z-index: 6;
        object-fit: contain; opacity: 0.9;
      }
            #progress-fill {
        position: absolute; left: 0; top: 1912px; width: 1080px; height: 8px; z-index: 7; transform-origin: 0 50%;
        background: linear-gradient(90deg, #a8701c, var(--gold), #fff1bf);
        box-shadow: 0 0 14px rgba(245,196,81,0.8);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="87.5" data-width="1080" data-height="1920">
      <div id="cam">
        <video
          id="footage" class="clip" src="assets/footage.mp4"
          data-start="0" data-duration="84.19" data-track-index="0"
          playsinline data-has-audio="true" data-volume="1"
        ></video>
      </div>

      <div id="vignette"></div>

      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html"
        data-start="0" data-duration="83" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:4"></div>

      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="3.6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:9"></div>

      <div id="lt1" data-composition-id="lt1" data-composition-src="compositions/lt1.html"
        data-start="3.8" data-duration="6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:9"></div>

      <div id="lt2" data-composition-id="lt2" data-composition-src="compositions/lt2.html"
        data-start="42.6" data-duration="6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:9"></div>

      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="82.6" data-duration="4.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>

      <img id="bug" class="clip" src="assets/logo.png" data-start="3.3" data-duration="79.3" data-track-index="3" />

      <div id="progress-fill" class="clip" data-start="0" data-duration="82.6" data-track-index="4"></div>

      <div id="flash"></div>

      <audio id="sfx-whoosh-in" class="clip" src="assets/whoosh.wav" data-start="0" data-duration="1.4" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-shimmer-in" class="clip" src="assets/shimmer.wav" data-start="0.35" data-duration="1.6" data-track-index="6" data-volume="0.22"></audio>
      <audio id="sfx-whoosh-out" class="clip" src="assets/whoosh.wav" data-start="82.4" data-duration="1.4" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-shimmer-out" class="clip" src="assets/shimmer.wav" data-start="83.2" data-duration="1.6" data-track-index="6" data-volume="0.25"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Segment boundaries of the silence-cut footage (output seconds).
      const B = [0, 1.51, 4.28, 7.21, 9.09, 12.92, 16.3, 22.36, 25.75, 27.12, 32.14, 36.82, 38.01, 39.78, 42.45,
        47.29, 49.78, 52.33, 56.37, 58.27, 62.18, 62.71, 64.33, 66.07, 68.41, 70.71, 72.95, 73.25, 74.17, 78.77, 80.24, 84.19];
      // Punch-in per segment: alternating framing hides the jump cuts.
      const Z = [1.0, 1.14, 1.04, 1.2, 1.0, 1.12, 1.03, 1.18];
      for (let i = 0; i < B.length - 1; i++) {
        const a = B[i], b = B[i + 1], z = Z[i % Z.length];
        tl.fromTo("#cam", { scale: z }, { scale: z + 0.035, duration: b - a, ease: "none" }, a);
      }
      // Warm flash on every third cut.
      for (let i = 3; i < B.length - 1; i += 3) {
        tl.fromTo("#flash", { opacity: 0.42 }, { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, B[i]);
      }
      tl.fromTo("#bug", { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1, duration: 0.45, ease: "back.out(2)" }, 3.3);
      tl.to("#bug", { opacity: 0, duration: 0.35, ease: "power2.in" }, 82.2);
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 82.6, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

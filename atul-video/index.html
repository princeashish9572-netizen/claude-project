    <script>
      const tl = gsap.timeline({ paused: true });
      const B = [0, 1.51, 4.28, 7.21, 9.09, 12.92, 16.3, 22.36, 25.75, 27.12, 32.14, 36.82, 38.01, 39.78, 42.45, 47.29, 49.78, 52.33, 56.37, 58.27, 62.18, 62.71, 64.33, 66.07, 68.41, 70.71, 72.95, 73.25, 74.17, 78.77, 80.24, 84.19];
      const Z = [1.0, 1.14, 1.05, 1.18, 1.02, 1.12, 1.07, 1.16];
      for (let i = 0; i < B.length - 1; i++) {
        const z = Z[i % Z.length];
        tl.fromTo("#cam", { scale: z, x: 0 }, { scale: z + 0.05, x: (i % 2 ? 8 : -8), duration: B[i + 1] - B[i], ease: "none" }, B[i]);
      }
      tl.fromTo("#bug", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 3.3);
      for (let t = 12; t < 80.6; t += 10) {
        tl.fromTo("#bug", { rotationY: 0 }, { rotationY: 360, duration: 1.2, ease: "power2.inOut", immediateRender: false }, t);
      }
      tl.to("#bug", { opacity: 0, duration: 0.35, ease: "power2.in" }, 82.19999999999999);
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 82.6, ease: "none" }, 0);
      window.__timelines["main"] = tl;
